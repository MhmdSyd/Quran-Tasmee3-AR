name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release APK (needs the signing secrets, see README)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. Data / structure checks: pure Python on the shipped databases, no network ----
  data-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate_quran_data.py
      - run: python3 tools/check_mushaf_structure.py
      - run: python3 tools/export_test_pages.py --check
      - name: Font and header image shipped byte-identical to the supplied files
        run: |
          test -s app/src/main/res/font/uthmanic_hafs.ttf
          test -s app/src/main/res/drawable-nodpi/surah_header_bg.png
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("app/src/main/assets/qpc-hafs.db")
          n = c.execute("select count(*) from verses").fetchone()[0]
          assert n == 6236, n
          print("verses:", n)
          PY

  # ---- 2. Build the debug APK (always uploaded), then run JVM tests ----
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ASR model + sherpa-onnx native libs (pinned, SHA-256 verified)
        run: bash tools/fetch_asr_assets.sh
      - name: Model alphabet vs Hafs text
        run: python3 tools/check_model_alphabet.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK checks (offline guarantees + required assets)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          echo "--- permissions"; "$AAPT2" dump permissions "$APK"
          if "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission must not be declared"; exit 1
          fi
          LIST=$(unzip -l "$APK")
          for f in assets/asr/quran-asr-small/model.int8.onnx assets/asr/quran-asr-small/tokens.txt \
                   assets/qpc-hafs.db assets/quran-index.db res/font/uthmanic_hafs.ttf; do
            echo "$LIST" | grep -q "$f" || { echo "missing in APK: $f"; exit 1; }
          done
          echo "$LIST" | grep -q "surah_header_bg.png" || { echo "missing surah_header_bg.png"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$LIST" | grep -q "lib/$abi/libsherpa-onnx-jni.so" || { echo "missing $abi native lib"; exit 1; }
          done
          ls -la "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Tasmee3-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # ---- 3. Real model + real audio on the desktop runtime (needs the internet for clips; independent of the APK) ----
  asr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/asr_smoke_requirements.txt
      - run: bash tools/fetch_asr_assets.sh
      - run: pip install -r tools/asr_smoke_requirements.txt
      - run: python3 tools/asr_smoke_test.py

  # ---- 4. Optional signed release APK. Skipped (not failed) when the secrets are not configured. ----
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::notice::Signing secrets not configured - release build skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.sign.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.sign.outputs.enabled == 'true'
      - name: Fetch ASR assets
        if: steps.sign.outputs.enabled == 'true'
        run: bash tools/fetch_asr_assets.sh
      - name: Build signed release APK
        if: steps.sign.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload release APK
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Tasmee3-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
